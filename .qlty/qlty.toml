config_version = "0"

exclude_patterns = [
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/deps/**",
  "**/dist/**",
  "**/generated/**",
  "**/target/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/assets/**",
]

test_patterns = [
  "**/*Tests/**",
  "**/Tests/**/*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "black"

[[plugin]]
name = "dotenv-linter"

[[plugin]]
name = "gitleaks"

[[plugin]]
name = "markdownlint"
version = "0.41.0"

[[plugin]]
name = "prettier"

[[plugin]]
name = "rubocop"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "swiftlint"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "swiftformat"
