---
format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

meta:
  bitrise.io:
    stack: osx-xcode-16.0.x
    machine_type_id: g2.mac.medium

trigger_map:
  - push_branch: "*"
    workflow: primary
  - pull_request_source_branch: "*"
    workflow: primary

workflows:
  deploy:
    steps:
      - activate-ssh-key@4.1:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - restore-spm-cache@2: {}
      - cache-pull@2: {}
      - script@1:
          title: Do anything with Script step
      - certificate-and-profile-installer@1: {}
      - carthage@3.2:
          inputs:
            - carthage_command: bootstrap
      - xcode-test@5:
          inputs:
            - project_path: "$BITRISE_PROJECT_PATH"
            - scheme: "$BITRISE_SCHEME"
      - xcode-archive@5:
          inputs:
            - project_path: "$BITRISE_PROJECT_PATH"
            - scheme: "$BITRISE_SCHEME"
            - export_method: "$BITRISE_EXPORT_METHOD"
      - deploy-to-bitrise-io@2: {}
      - cache-push@2: {}
      - save-spm-cache@1: {}
  primary:
    steps:
      - activate-ssh-key@4.1:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
          inputs:
            - verbose: "true"
      - git-clone@8: {}
      - cache-pull@2.7: {}
      - script@1.2:
          title: Do anything with Script step
      - certificate-and-profile-installer@1: {}
      - carthage@3.2:
          inputs:
            - carthage_command: bootstrap
      - deploy-to-bitrise-io@2: {}
      - cache-push@2.7: {}
  Test-PR:
    steps:
      - activate-ssh-key:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone: {}
      - restore-spm-cache: {}
      - fastlane:
          inputs:
            - api_key_path:
            - api_issuer:
            - apple_id:
            - password:
            - app_password:
            - lane: test_iphone_x
      - save-spm-cache: {}
    triggers:
      pull_request:
        - target_branch: main
app:
  envs:
    - opts:
        is_expand: false
      BITRISE_PROJECT_PATH: MobileCI.xcodeproj
    - opts:
        is_expand: false
      BITRISE_SCHEME: MobileCI-iOS
    - opts:
        is_expand: false
      BITRISE_EXPORT_METHOD: ad-hoc
