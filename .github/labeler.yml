CI/CD:
    - changed-files:
          - any-glob-to-any-file:
                - .circleci/*
                - .codeclimate.yml
                - .github/*
                - .ruby-version
                - .swift-version
                - Dangerfile
                - fastlane/*
                - Makefile
                - travis.yml
Tests:
    - changed-files:
          - any-glob-to-any-file:
                - Tests/*
dependencies:
    - changed-files:
          - any-glob-to-any-file:
                - .gitmodules
                - Brewfile
                - Cartfile
                - Cartfile.private
                - Carthage/*
                - Gemfile
                - Gemfile.lock
                - Podfile
                - Podfile.lock
                - Pods/*
                - Romefile
documentation:
    - changed-files:
          - any-glob-to-any-file:
                - CHANGELOG.md
                - doc/*
                - Documentation/*
                - jazzy.yml
                - README.md
enhancement:
    - changed-files:
          - any-glob-to-any-file:
                - .sourcery.yml
                - swiftgen.yml
